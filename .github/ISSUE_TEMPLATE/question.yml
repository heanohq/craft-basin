name: Question
description: How do I do something with the plugin?
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        The [documentation](https://heano.io/craft-plugins/basin/docs/) may already answer it.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you're trying to do, and what you've tried.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Plugin, Craft and PHP versions
      placeholder: "Plugin 1.0.0, Craft 5.5.0, PHP 8.3"
