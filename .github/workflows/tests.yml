name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily, so a new Craft or dependency release that breaks the plugin is
  # caught even when nothing here changed (highest dependencies are resolved
  # fresh on every run).
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.2'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # Composer won't install versions with known security advisories, which
      # rules out Craft 5.0 to 5.10. The lowest run allows them, so it tests the
      # oldest Craft the plugin supports. The audit job stays strict.
      - name: Allow the oldest supported versions
        if: matrix.dependencies == 'lowest'
        run: composer config policy.advisories.block false

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Check syntax
        run: find src tests integration-tests/support integration-tests/tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Show Craft version
        run: composer show craftcms/cms | grep -E '^versions'

      - name: Run tests
        run: vendor/bin/pest

  integration:
    name: Craft integration (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            dependencies: lowest
          - php: '8.5'
            dependencies: highest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: basin_tests
          MYSQL_USER: db
          MYSQL_PASSWORD: db
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CRAFT_DB_SERVER: 127.0.0.1
      CRAFT_DB_PORT: 3306
      CRAFT_DB_USER: db
      CRAFT_DB_PASSWORD: db
    defaults:
      run:
        working-directory: integration-tests
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Allow the oldest supported versions
        if: matrix.dependencies == 'lowest'
        run: composer config policy.advisories.block false

      - uses: ramsey/composer-install@v3
        with:
          working-directory: integration-tests
          dependency-versions: ${{ matrix.dependencies }}

      - name: Show Craft version
        run: composer show craftcms/cms | grep -E '^versions'

      - name: Run integration tests
        run: vendor/bin/pest

      - name: Run uninstall tests
        run: vendor/bin/pest --testsuite=Uninstall

  browser:
    name: Browser (PHP 8.5)
    # Playwright doesn't support Ubuntu 26.04 (ubuntu-latest) yet.
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: basin_tests
          MYSQL_USER: db
          MYSQL_PASSWORD: db
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CRAFT_DB_SERVER: 127.0.0.1
      CRAFT_DB_PORT: 3306
      CRAFT_DB_USER: db
      CRAFT_DB_PASSWORD: db
    defaults:
      run:
        working-directory: integration-tests
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pest's browser plugin needs Pest 4 (PHP 8.3+), so it's added here
      # rather than in composer.json, which also has to work on PHP 8.2.
      - name: Install dependencies with Pest's browser plugin
        run: composer require --dev --no-interaction --with-all-dependencies "pestphp/pest:^4.0" "pestphp/pest-plugin-browser:^4.0"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.59.1
          npx playwright install --with-deps chromium

      - name: Run browser tests
        run: vendor/bin/pest --testsuite=Browser

  blitz:
    name: Blitz static caching (PHP 8.5)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: basin_tests
          MYSQL_USER: db
          MYSQL_PASSWORD: db
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CRAFT_DB_SERVER: 127.0.0.1
      CRAFT_DB_PORT: 3306
      CRAFT_DB_USER: db
      CRAFT_DB_PASSWORD: db
    defaults:
      run:
        working-directory: integration-tests
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      # Blitz needs a newer Craft than the oldest the plugin supports, so it's
      # added here rather than in composer.json. The newest Blitz every day,
      # so a release that changes the event the plugin uses is caught.
      - name: Install dependencies with Blitz
        run: composer require --dev --no-interaction --with-all-dependencies "putyourlightson/craft-blitz:^5.0"

      - name: Show Craft and Blitz versions
        run: composer show craftcms/cms putyourlightson/craft-blitz | grep -E '^(name|versions)'

      - name: Run Blitz tests
        run: vendor/bin/pest --testsuite=Blitz

  docs:
    name: Docs and CAPTCHA providers
    # The docs are in heano's private site repo, which a fork's pull request
    # can't read. They're checked again once it's merged.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Playwright doesn't support Ubuntu 26.04 (ubuntu-latest) yet.
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: basin_tests
          MYSQL_USER: db
          MYSQL_PASSWORD: db
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CRAFT_DB_SERVER: 127.0.0.1
      CRAFT_DB_PORT: 3306
      CRAFT_DB_USER: db
      CRAFT_DB_PASSWORD: db
    defaults:
      run:
        working-directory: integration-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.SUPPORT_APP_ID }}
          private-key: ${{ secrets.SUPPORT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: heano
          permission-contents: read

      # The published docs. heano's own workflow checks docs changes before
      # they're published.
      - name: Check out the docs
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/heano
          ref: master
          token: ${{ steps.app.outputs.token }}
          path: heano
          sparse-checkout: src/content/docs/craft-plugins/basin/docs
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies with Pest's browser plugin
        run: composer require --dev --no-interaction --with-all-dependencies "pestphp/pest:^4.0" "pestphp/pest-plugin-browser:^4.0"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.59.1
          npx playwright install --with-deps chromium

      - name: Check the docs against the plugin
        run: vendor/bin/pest --testsuite=Docs
        env:
          DOCS_DIR: ${{ github.workspace }}/heano/src/content/docs/craft-plugins/basin/docs

      # Daily too, so a provider changing what its script loads is caught.
      - name: Check the real CAPTCHA providers under the docs' CSP
        if: success() || failure()
        run: vendor/bin/pest --testsuite=Providers
        env:
          DOCS_DIR: ${{ github.workspace }}/heano/src/content/docs/craft-plugins/basin/docs

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Check dependencies for known vulnerabilities
        run: composer audit --no-dev

  report:
    name: Report a failed daily run
    needs: [tests, integration, browser, blitz, docs, audit]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Daily tests failed'
          number=$(gh issue list --state open --label 'daily-tests' --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --label 'daily-tests' --body "The daily run against the newest Craft and dependencies, the published docs and the real CAPTCHA providers failed: $RUN_URL

          Close this issue once the run passes again."
          fi
