name: Claude token reminder

# The CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` lasts a year. This opens
# an issue in craft-basin-internal 30 days before it expires, from the date in
# the CLAUDE_TOKEN_CREATED variable (YYYY-MM-DD). See .github/triage/README.md.

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check the token's age
    runs-on: ubuntu-latest
    steps:
      - name: Work out what's due
        id: due
        env:
          CREATED: ${{ vars.CLAUDE_TOKEN_CREATED }}
        run: |
          if ! [[ "$CREATED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "message=The \`CLAUDE_TOKEN_CREATED\` variable on craft-basin isn't set to a date (YYYY-MM-DD), so there's no telling when \`CLAUDE_CODE_OAUTH_TOKEN\` expires." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expires=$(date -u -d "$CREATED + 1 year" +%F)
          if [ "$(date -u -d "$expires - 30 days" +%s)" -le "$(date -u +%s)" ]; then
            echo "message=\`CLAUDE_CODE_OAUTH_TOKEN\` on craft-basin expires on $expires. Until it's renewed, triage runs will fail." >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@v2
        if: steps.due.outputs.message
        id: app
        with:
          app-id: ${{ vars.SUPPORT_APP_ID }}
          private-key: ${{ secrets.SUPPORT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: craft-basin-internal

      - name: Open or update the reminder
        if: steps.due.outputs.message
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository_owner }}/craft-basin-internal
          MESSAGE: ${{ steps.due.outputs.message }}
        run: |
          gh label create token-renewal --color fbca04 --description 'Renew the Claude Code token' > /dev/null 2>&1 || true
          number=$(gh issue list --state open --label token-renewal --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still due: $MESSAGE"
          else
            gh issue create --title 'Renew the Claude Code token' --label token-renewal --body "@peteheaney $MESSAGE

          1. Run \`claude setup-token\`.
          2. Run \`gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo heanohq/craft-basin\` and paste the new token.
          3. Run \`gh variable set CLAUDE_TOKEN_CREATED --repo heanohq/craft-basin --body \$(date +%F)\`.
          4. Run the Triage workflow by hand on a fixture to check it works, then close this issue.

          The old token keeps working until it expires, so there's no gap."
          fi
